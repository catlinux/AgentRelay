# Compila el instalador de Windows (AgentRelay-Setup.exe) con Inno Setup.
#
# - Al subir una etiqueta de versión (v*): lo compila y lo adjunta a la release de esa etiqueta
#   (la crea si no existe). Enlace fijo a la última:
#   https://github.com/catlinux/AgentRelay/releases/latest/download/AgentRelay-Setup.exe
# - A mano (Actions > Instalador de Windows > Run workflow): lo compila y lo deja como artefacto
#   descargable de la ejecución, sin crear ninguna release.
#
# El .exe no está firmado: Windows SmartScreen avisará la primera vez.

name: Instalador de Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  instalador:
    name: Compilar AgentRelay-Setup.exe
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v5

      - name: Versión
        id: version
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          }
          "version=$version" >> $env:GITHUB_OUTPUT
          "Versión: $version"

      - name: Instalar Inno Setup si falta
        run: |
          $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = @("${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe", "$env:ProgramFiles\Inno Setup 6\ISCC.exe") | Where-Object { Test-Path $_ } | Select-Object -First 1
          }
          if (-not $iscc) { throw 'No se encontró ISCC.exe' }
          "ISCC=$iscc" >> $env:GITHUB_ENV

      - name: Compilar
        run: |
          & $env:ISCC "/DAppVersion=${{ steps.version.outputs.version }}" installer\windows\agentrelay.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC terminó con código $LASTEXITCODE" }
          Get-Item .agentrelay\installer\AgentRelay-Setup.exe | Select-Object Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: AgentRelay-Setup
          path: .agentrelay/installer/AgentRelay-Setup.exe
          if-no-files-found: error

      - name: Adjuntar a la release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:GITHUB_REF_NAME 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --title "AgentRelay $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'No se pudo crear la release' }
          }
          gh release upload $env:GITHUB_REF_NAME .agentrelay/installer/AgentRelay-Setup.exe --clobber
          if ($LASTEXITCODE -ne 0) { throw 'No se pudo adjuntar el instalador' }
