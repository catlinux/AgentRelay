# Integración continua en Windows: 4 versiones de Node.js.
name: CI Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]        # Windows x64
        node: ['20', '22', '24', 'node']   # 'node' = la última versión publicada
    uses: ./.github/workflows/_test.yml
    with:
      os: ${{ matrix.os }}
      node: ${{ matrix.node }}
